[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vynn-mcp"
version = "0.1.1"
description = "MCP server for Vynn — self-improving AI workflows & backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vynn", email = "hello@the-vynn.com"},
]
keywords = ["mcp", "ai", "workflows", "backtesting", "llm", "self-improving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://the-vynn.com"
Repository = "https://github.com/beee003/vynn-mcp"
Documentation = "https://the-vynn.com/docs"

[project.scripts]
vynn-mcp = "vynn_mcp.server:main"
